[project]
name = "visualizer-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "manim[typst]>=0.22.0",
    "mne>=1.13.2",
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
flydoom = [
    "numba==0.68.0",
    "pyarrow==26.0.0",
    "vizdoom==1.3.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "scenes"]
testpaths = ["tests"]
